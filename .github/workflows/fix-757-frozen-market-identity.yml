name: Fix 757 frozen market identity
on:
  push:
    branches: [research/310-ma-volume-frozen-run-v1]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/310-ma-volume-frozen-run-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove current venue_market dependency
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/research/run_ma_volume_frozen_validation_v1.py')
          s = p.read_text()
          old = '''def fetch_unique_market_map(conn: Any, *, venue: str, asset_ids: Iterable[int]) -> dict[int, str]:\n    ids = sorted(set(int(asset_id) for asset_id in asset_ids))\n    result: dict[int, str] = {}\n    for start in range(0, len(ids), ASSET_BATCH_SIZE):\n        batch = ids[start : start + ASSET_BATCH_SIZE]\n        placeholders = ",".join(["%s"] * len(batch))\n        sql = f"""\n        SELECT base_asset_id AS asset_id, market\n        FROM venue_market\n        WHERE venue=%s AND is_tradeable=1 AND base_asset_id IN ({placeholders})\n        ORDER BY base_asset_id, market\n        """\n        with conn.cursor() as cur:\n            cur.execute(sql, (venue, *batch))\n            rows = cur.fetchall()\n        grouped: dict[int, list[str]] = defaultdict(list)\n        for row in rows:\n            grouped[int(row["asset_id"])].append(str(row["market"]))\n        for asset_id in batch:\n            markets = grouped.get(asset_id, [])\n            if len(markets) == 1:\n                result[asset_id] = markets[0]\n    return result\n'''
          new = '''def frozen_grouping_market_map(*, venue: str, asset_ids: Iterable[int]) -> dict[int, str]:\n    \"\"\"Return a deterministic grouping key from frozen observation identity only.\n\n    ``ma_volume_candidate_features_v1`` requires a single market/group label, but\n    ``obs_market_candle`` itself is keyed by asset/venue/interval. Using current\n    ``venue_market`` state would make historical reruns depend on later pair\n    listings/delistings. The frozen asset_id + venue identity is sufficient and\n    stable for this single-asset feature frame.\n    \"\"\"\n    return {\n        asset_id: f\"asset:{asset_id}@{venue}\"\n        for asset_id in sorted(set(int(value) for value in asset_ids))\n    }\n'''
          assert old in s
          s = s.replace(old, new)
          old_call = '''        market_by_asset = fetch_unique_market_map(\n            conn,\n            venue=args.venue,\n            asset_ids=[int(row["asset_id"]) for row in selected],\n        )\n'''
          new_call = '''        market_by_asset = frozen_grouping_market_map(\n            venue=args.venue,\n            asset_ids=[int(row["asset_id"]) for row in selected],\n        )\n'''
          assert old_call in s
          s = s.replace(old_call, new_call)
          p.write_text(s)

          t = Path('tests/test_ma_volume_frozen_validation_v1.py')
          x = t.read_text()
          x = x.replace('    fetch_unique_market_map,\n', '    frozen_grouping_market_map,\n')
          old_test = '''def test_market_resolution_fails_closed_for_ambiguous_assets() -> None:\n    conn = _Conn([[{"asset_id": 1, "market": "BTC-EUR"}, {"asset_id": 2, "market": "AAA-EUR"}, {"asset_id": 2, "market": "AAA-USDC"}]])\n    assert fetch_unique_market_map(conn, venue="bitvavo", asset_ids=[1, 2]) == {1: "BTC-EUR"}\n'''
          new_test = '''def test_frozen_grouping_market_identity_is_independent_of_current_pair_state() -> None:\n    assert frozen_grouping_market_map(venue="bitvavo", asset_ids=[2, 1, 2]) == {\n        1: "asset:1@bitvavo",\n        2: "asset:2@bitvavo",\n    }\n'''
          assert old_test in x
          x = x.replace(old_test, new_test)
          t.write_text(x)

          d = Path('docs/research/ma_volume_frozen_validation_run_v1.md')
          y = d.read_text()
          old_doc = '''`obs_market_candle` is keyed by asset/venue/interval rather than market pair.\nThe runner uses the current canonical `venue_market` table only to require one\nunambiguous display/grouping market for the asset. An ambiguous mapping fails\nclosed for that observation; it does not duplicate the candle series across\nmarkets.\n'''
          new_doc = '''`obs_market_candle` is keyed by asset/venue/interval rather than market pair.\nThe feature builder still requires a grouping label, so the runner derives a\ndeterministic internal grouping key from the frozen observation identity:\n`asset:<asset_id>@<venue>`. It never reads current `venue_market` state. Later\npair listings, delistings or quote-market changes therefore cannot alter a\nrerun of the same frozen population.\n'''
          assert old_doc in y
          d.write_text(y.replace(old_doc, new_doc))
          PY
      - name: Focused validation
        run: |
          python -m pip install -q pytest pandas numpy pymysql python-dotenv
          python -m py_compile src/research/run_ma_volume_frozen_validation_v1.py
          pytest -q tests/test_ma_volume_frozen_validation_v1.py
          ! grep -n 'FROM venue_market' src/research/run_ma_volume_frozen_validation_v1.py
          git diff --check
      - name: Commit exact fix and self-delete workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/research/run_ma_volume_frozen_validation_v1.py tests/test_ma_volume_frozen_validation_v1.py docs/research/ma_volume_frozen_validation_run_v1.md
          git rm .github/workflows/fix-757-frozen-market-identity.yml
          git commit -m 'Fix #757 frozen market identity reproducibility'
          git push origin HEAD:research/310-ma-volume-frozen-run-v1
