name: Temporary Issue 553 Patch

on:
  push:
    branches:
      - worktree/553-remove-zone-labels-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Apply bounded Profit Plan copy patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/reporting/manual_short_trader_profit_plan_v1.py')
          text = path.read_text()
          replacements = {
              'Re-entry zone': 'Re-entry',
              'Target zone': 'Target',
              'Entry zone': 'Entry',
              'Reference re-entry zone': 'Reference re-entry',
              'Non-canonical reference re-entry zone': 'Non-canonical reference re-entry',
              'Non-canonical reference target zone': 'Non-canonical reference target',
              'Navigation target zone': 'Navigation target',
              'Historical target zone': 'Historical target',
              'Invalidated re-entry zone': 'Invalidated re-entry',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)

          test = Path('tests/test_profit_plan_compact_fib_labels_v1.py')
          test.write_text('''from decimal import Decimal\nfrom types import SimpleNamespace\n\nfrom src.reporting.manual_short_trader_profit_plan_v1 import (\n    CARD_ACTIONABILITY_ACTIVE,\n    CARD_ACTIONABILITY_CONTEXT_UNAVAILABLE,\n    CARD_ACTIONABILITY_HISTORICAL_REFERENCE,\n    CARD_ACTIONABILITY_INVALIDATED,\n    CARD_ACTIONABILITY_NAVIGATION_ONLY,\n    CARD_ACTIONABILITY_NEEDS_RECOMPUTE,\n    CARD_MODE_POSITION_HELD,\n    _actionability_display_bundle,\n)\n\n\ndef _card(state: str):\n    return SimpleNamespace(\n        reload_reentry_zone=(Decimal("1"), Decimal("2")),\n        target_exit_zone=(Decimal("3"), Decimal("4")),\n        sell_zone=(Decimal("3"), Decimal("4")),\n        current_price=Decimal("2.5"),\n        presentation_mode=CARD_MODE_POSITION_HELD,\n        actionability_state=state,\n    )\n\n\ndef test_active_profit_plan_fib_labels_are_compact():\n    labels = _actionability_display_bundle(_card(CARD_ACTIONABILITY_ACTIVE))[:2]\n    assert labels == ("Re-entry", "Target")\n\n\ndef test_state_qualified_profit_plan_fib_labels_do_not_say_zone():\n    states = (\n        CARD_ACTIONABILITY_CONTEXT_UNAVAILABLE,\n        CARD_ACTIONABILITY_NAVIGATION_ONLY,\n        CARD_ACTIONABILITY_HISTORICAL_REFERENCE,\n        CARD_ACTIONABILITY_NEEDS_RECOMPUTE,\n        CARD_ACTIONABILITY_INVALIDATED,\n    )\n    for state in states:\n        reentry_label, target_label = _actionability_display_bundle(_card(state))[:2]\n        assert "zone" not in reentry_label.lower()\n        assert "zone" not in target_label.lower()\n''')
          PY
      - name: Focused validation
        run: |
          python - <<'PY'
          from decimal import Decimal
          from types import SimpleNamespace
          from src.reporting.manual_short_trader_profit_plan_v1 import (
              CARD_ACTIONABILITY_ACTIVE,
              CARD_ACTIONABILITY_CONTEXT_UNAVAILABLE,
              CARD_ACTIONABILITY_HISTORICAL_REFERENCE,
              CARD_ACTIONABILITY_INVALIDATED,
              CARD_ACTIONABILITY_NAVIGATION_ONLY,
              CARD_ACTIONABILITY_NEEDS_RECOMPUTE,
              CARD_MODE_POSITION_HELD,
              _actionability_display_bundle,
          )

          def card(state):
              return SimpleNamespace(
                  reload_reentry_zone=(Decimal('1'), Decimal('2')),
                  target_exit_zone=(Decimal('3'), Decimal('4')),
                  sell_zone=(Decimal('3'), Decimal('4')),
                  current_price=Decimal('2.5'),
                  presentation_mode=CARD_MODE_POSITION_HELD,
                  actionability_state=state,
              )

          assert _actionability_display_bundle(card(CARD_ACTIONABILITY_ACTIVE))[:2] == ('Re-entry', 'Target')
          for state in (
              CARD_ACTIONABILITY_CONTEXT_UNAVAILABLE,
              CARD_ACTIONABILITY_NAVIGATION_ONLY,
              CARD_ACTIONABILITY_HISTORICAL_REFERENCE,
              CARD_ACTIONABILITY_NEEDS_RECOMPUTE,
              CARD_ACTIONABILITY_INVALIDATED,
          ):
              reentry_label, target_label = _actionability_display_bundle(card(state))[:2]
              assert 'zone' not in reentry_label.lower()
              assert 'zone' not in target_label.lower()
          PY
          git diff --check
      - name: Commit bounded patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/reporting/manual_short_trader_profit_plan_v1.py tests/test_profit_plan_compact_fib_labels_v1.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m '#553 remove zone wording from Profit Plan fib labels'
          git push origin HEAD:${GITHUB_REF_NAME}
