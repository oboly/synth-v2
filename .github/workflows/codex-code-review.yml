name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: codex-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Validate Codex API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo 'OPENAI_API_KEY repository secret is not configured; Codex review cannot start.' >&2
            exit 1
          fi

      - name: Checkout PR merge commit
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Pre-fetch base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-terra
          effort: low
          permission-profile: ":read-only"
          allow-bot-users: github-actions[bot]
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            HOST: GitHub-hosted ubuntu-latest
            MODEL: gpt-5.6-terra
            EFFORT: low
            ROLE: reviewer
            THREAD: CLEAR
            DEPLOYMENT PERMISSION: not granted
            RUNTIME MUTATION PERMISSION: not granted
            DB WRITE PERMISSION: not granted
            BROKER / PRIVATE API PERMISSION: not granted

            First read AGENTS.md and CODEX.md.
            Review only the exact PR delta between:
              base ${{ github.event.pull_request.base.sha }}
              head ${{ github.event.pull_request.head.sha }}

            Focus on architecture boundaries, safety, regressions, determinism, test adequacy, and unintended scope.
            Do not implement fixes, change files, commit, push, merge, deploy, mutate runtime/DB state, or use private broker APIs.
            Do not reconstruct project history or perform broad repository exploration unless a concrete finding requires it.
            Return the terse review shape required by AGENTS.md: PASS/BLOCK, issues, minimal fixes only.

            Pull request title and body:
            ----
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

  post-review:
    needs: codex-review
    if: needs.codex-review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Post Codex review
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
