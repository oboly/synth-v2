name: Fix 688 Attention Summary

on:
  push:
    branches:
      - fix/688-profit-plan-attention-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/688-profit-plan-attention-v1
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install pytest pymysql
      - name: Apply minimal canonical Attention summary fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/reporting/run_manual_short_trader_profit_plan_v1.py')
          text = path.read_text(encoding='utf-8')
          old_line = '    attention_count = sum(1 for card in cards if card.visibility_class == VISIBILITY_NATIVE_ATTENTION)\n'
          new_line = '    attention_count = sum(1 for card in cards if card.attention_required)\n'
          if text.count(old_line) != 1:
              raise SystemExit(f'expected exactly one stale attention_count line, found {text.count(old_line)}')
          text = text.replace(old_line, new_line)

          old_comment = '''    # Issue #212: is_relevant (attention/actionability) and visibility_class\n    # (default-view grouping) are separate concerns. A card can be fully\n    # present in the rendered view (all cards always are) while being\n    # non-actionable -- that combination must be labeled by its\n    # visibility_class, never reported as "filtered". visibility_class is a\n    # three-way, mutually-exclusive partition of every card, so the three\n    # counts below always sum to len(cards).\n'''
          new_comment = '''    # Issues #212/#688: is_relevant (sort/filter relevance),\n    # attention_required (operator triage), and visibility_class\n    # (default-view grouping) are separate concerns. The runner's attention=\n    # summary must use the same canonical per-card attention_required field as\n    # HTML/JSON; visibility counts remain an independent three-way partition.\n'''
          if old_comment not in text:
              raise SystemExit('expected stale summary comment not found')
          text = text.replace(old_comment, new_comment)
          path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_profit_plan_attention_summary_v1.py <<'PY'
          from pathlib import Path
          from types import SimpleNamespace

          from src.reporting.manual_short_trader_profit_plan_v1 import (
              VISIBILITY_CONTEXT_UNAVAILABLE,
              VISIBILITY_NATIVE_ATTENTION,
          )
          from src.reporting.run_manual_short_trader_profit_plan_v1 import print_summary


          def _card(*, symbol: str, attention_required: bool, visibility_class: str):
              return SimpleNamespace(
                  symbol=symbol,
                  short_context_coverage_status="MARKET_DATA_MISSING",
                  visibility_class=visibility_class,
                  attention_required=attention_required,
                  scenario_type="TEST",
                  action_label="WAIT",
                  primary_state="WAIT_FOR_ENTRY",
                  is_relevant=True,
              )


          def test_print_summary_attention_uses_canonical_attention_required(capsys, tmp_path: Path) -> None:
              context = SimpleNamespace(
                  profile="test",
                  account_code="test",
                  trading_account_id=1,
                  venue="bitvavo",
                  markets=("AAA-EUR", "BBB-EUR"),
                  orders=(),
              )
              cards = [
                  _card(
                      symbol="AAA",
                      attention_required=False,
                      visibility_class=VISIBILITY_NATIVE_ATTENTION,
                  ),
                  _card(
                      symbol="BBB",
                      attention_required=True,
                      visibility_class=VISIBILITY_CONTEXT_UNAVAILABLE,
                  ),
              ]

              print_summary(
                  context=context,
                  cards=cards,
                  output_html=tmp_path / "profit-plan.html",
                  output_json=tmp_path / "profit-plan.json",
              )

              output = capsys.readouterr().out
              assert "attention=1/2" in output
              assert "canonical_navigation=0/2" in output
              assert "context_unavailable=1/2" in output
          PY

          rm .github/workflows/fix-688-attention-summary.yml

      - name: Validate focused regression
        run: |
          python -m pytest -q tests/test_profit_plan_attention_summary_v1.py
          python -m py_compile src/reporting/run_manual_short_trader_profit_plan_v1.py
          git diff --check
      - name: Commit and push final fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/reporting/run_manual_short_trader_profit_plan_v1.py tests/test_profit_plan_attention_summary_v1.py .github/workflows/fix-688-attention-summary.yml
          git commit -m "Fix #688 runner Attention summary parity"
          git push origin HEAD:fix/688-profit-plan-attention-v1
