name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01TYKgXAv71EoxCVKeSbxmGp
          anthropic_organization_id: 7418e2e6-9e2e-4fe0-bf59-847e76f4fce6
          anthropic_service_account_id: svac_01HU7ZCmaWhxpdh6cosJ6VP4
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            HOST: GitHub-hosted ubuntu-latest
            MODEL: sonnet
            EFFORT: low
            ROLE: reviewer
            THREAD: CLEAR
            DEPLOYMENT PERMISSION: not granted
            RUNTIME MUTATION PERMISSION: not granted
            DB WRITE PERMISSION: not granted
            BROKER / PRIVATE API PERMISSION: not granted

            First read AGENTS.md and CLAUDE.md.
            Review only the exact PR diff and evidence needed to decide PASS or BLOCK.
            Focus on architecture boundaries, safety, regressions, determinism, test adequacy, and unintended scope.
            Do not implement fixes, change files, commit, push, merge, deploy, mutate runtime/DB state, or use private broker APIs.
            Do not reconstruct project history or perform broad repository exploration unless a concrete finding requires it.
            Return the terse review shape required by AGENTS.md: PASS/BLOCK, issues, minimal fixes only.
          claude_args: |
            --model sonnet
            --effort low
            --max-turns 10
            --allowedTools "Read,Glob,Grep,Bash(git diff *),Bash(git status *),Bash(git log *)"
            --disallowedTools WebSearch
