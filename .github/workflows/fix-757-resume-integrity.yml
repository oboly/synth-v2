name: Fix 757 resume integrity
on:
  push:
    branches: [research/310-ma-volume-frozen-run-v1]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/310-ma-volume-frozen-run-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact Codex blockers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/research/run_ma_volume_frozen_validation_v1.py')
          s = p.read_text()
          s = s.replace(
          'def load_checkpointed_rows(path: Path, rows_written: int) -> list[dict[str, Any]]:',
          'def load_checkpointed_rows(\n    path: Path,\n    rows_written: int,\n    *,\n    expected_observation_ids: Iterable[str] | None = None,\n) -> list[dict[str, Any]]:'
          )
          old = '''    rows = [json.loads(line) for line in lines[:rows_written]]\n    path.write_text("".join(row_line(row) for row in rows), encoding="utf-8")\n    return rows\n'''
          new = '''    rows = [json.loads(line) for line in lines[:rows_written]]\n    if expected_observation_ids is not None:\n        expected = [str(value) for value in expected_observation_ids]\n        if len(expected) < rows_written:\n            raise ValueError("checkpoint row count exceeds selected observation identity prefix")\n        actual = [str(row.get("observation_id")) for row in rows]\n        if actual != expected[:rows_written]:\n            raise ValueError("checkpoint candidate observation-id prefix mismatch")\n    path.write_text("".join(row_line(row) for row in rows), encoding="utf-8")\n    return rows\n'''
          assert old in s
          s = s.replace(old, new)
          s = s.replace(
          '    candidate_filename: str,\n) -> tuple[dict[str, Any], int, list[dict[str, Any]]]:',
          '    candidate_filename: str,\n    expected_observation_ids: list[str],\n) -> tuple[dict[str, Any], int, list[dict[str, Any]]]:'
          )
          s = s.replace(
          '        return checkpoint, completed, load_checkpointed_rows(candidate_path, rows_written)',
          '        return checkpoint, completed, load_checkpointed_rows(\n            candidate_path,\n            rows_written,\n            expected_observation_ids=expected_observation_ids,\n        )'
          )
          s = s.replace(
          'def _execute(args: argparse.Namespace, *, started: float) -> tuple[dict[str, Any], dict[str, Any]]:',
          'def _execute(\n    args: argparse.Namespace,\n    *,\n    started: float,\n    state: dict[str, Any],\n) -> tuple[dict[str, Any], dict[str, Any]]:'
          )
          s = s.replace(
          '        candidate_filename=candidate_filename,\n    )',
          '        candidate_filename=candidate_filename,\n        expected_observation_ids=[str(row["observation_id"]) for row in selected],\n    )',
          1
          )
          old_state = '''    state: dict[str, Any] = {\n        "output_dir": output_dir,\n        "identity": identity,\n        "asofs_completed": completed_asofs,\n        "candidate_rows_written": len(candidate_rows),\n        "last_asof_ts_utc": checkpoint.get("last_asof_ts_utc"),\n    }\n'''
          new_state = '''    state.update(\n        {\n            "output_dir": output_dir,\n            "identity": identity,\n            "asofs_completed": completed_asofs,\n            "candidate_rows_written": len(candidate_rows),\n            "last_asof_ts_utc": checkpoint.get("last_asof_ts_utc"),\n        }\n    )\n'''
          assert old_state in s
          s = s.replace(old_state, new_state)
          s = s.replace(
          '        manifest, execution_state = _execute(args, started=started)',
          '        manifest, execution_state = _execute(args, started=started, state=state)'
          )
          p.write_text(s)

          t = Path('tests/test_ma_volume_frozen_validation_v1.py')
          x = t.read_text()
          x = x.replace(
          '    assert load_checkpointed_rows(path, 1) == [{"observation_id": "a"}]',
          '    assert load_checkpointed_rows(path, 1, expected_observation_ids=["a"]) == [{"observation_id": "a"}]'
          )
          marker = 'def test_scope_identity_binds_exact_selected_observation_ids() -> None:\n'
          extra = '''def test_resume_loader_rejects_corrupted_checkpoint_identity_prefix(tmp_path: Path) -> None:\n    path = tmp_path / "candidate_observations.jsonl"\n    path.write_text(json.dumps({"observation_id": "wrong"}) + "\\n", encoding="utf-8")\n    with pytest.raises(ValueError, match="observation-id prefix mismatch"):\n        load_checkpointed_rows(path, 1, expected_observation_ids=["expected"])\n\n\n'''
          assert marker in x
          x = x.replace(marker, extra + marker)
          x = x.replace('def interrupted(_args, *, started):\n        raise _Interrupted(signal.SIGINT)', '''def interrupted(_args, *, started, state):\n        output = Path(_args.output_dir)\n        output.mkdir(parents=True, exist_ok=True)\n        identity = {"runner": runner.RUNNER_NAME, "contract_sha256": "x"}\n        state.update({\n            "output_dir": output,\n            "identity": identity,\n            "asofs_completed": 2,\n            "candidate_rows_written": 5,\n            "last_asof_ts_utc": "2026-08-02T00:00:00Z",\n        })\n        write_terminal_checkpoint(\n            output, identity=identity, terminal_state="RUNNING",\n            asofs_completed=2, candidate_rows_written=5,\n            last_asof_ts_utc="2026-08-02T00:00:00Z",\n        )\n        raise _Interrupted(signal.SIGINT)''')
          x = x.replace('def finished(_args, *, started):', 'def finished(_args, *, started, state):')
          x = x.replace(
          '    assert not any(line.startswith("FINISHED ") or line.startswith("FAILED ") for line in lines)\n',
          '    assert not any(line.startswith("FINISHED ") or line.startswith("FAILED ") for line in lines)\n    checkpoint = json.loads((tmp_path / "output" / "checkpoint.json").read_text(encoding="utf-8"))\n    assert checkpoint["terminal_state"] == "INTERRUPTED"\n    assert checkpoint["asofs_completed"] == 2\n    assert checkpoint["candidate_rows_written"] == 5\n'
          )
          t.write_text(x)
          PY
      - name: Focused validation
        run: |
          python -m pip install -q pytest pandas numpy pymysql python-dotenv
          python -m py_compile src/research/run_ma_volume_frozen_validation_v1.py
          pytest -q tests/test_ma_volume_frozen_validation_v1.py
          git diff --check
      - name: Commit exact fix and self-delete workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/research/run_ma_volume_frozen_validation_v1.py tests/test_ma_volume_frozen_validation_v1.py
          git rm .github/workflows/fix-757-resume-integrity.yml
          git commit -m 'Fix #757 interruption and resume integrity'
          git push origin HEAD:research/310-ma-volume-frozen-run-v1
