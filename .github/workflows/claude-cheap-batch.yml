name: Claude Cheap Batch

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  haiku:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '[agent:haiku]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Haiku
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          prompt: |
            HOST: GitHub-hosted ubuntu-latest
            MODEL: haiku
            EFFORT: default
            ROLE: implementer
            THREAD: CLEAR
            DEPLOYMENT PERMISSION: not granted
            RUNTIME MUTATION PERMISSION: not granted
            DB WRITE PERMISSION: not granted
            BROKER / PRIVATE API PERMISSION: not granted

            Implement GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Trigger instructions:
            ${{ github.event.comment.body }}

            First read AGENTS.md, CLAUDE.md, and docs/ops/agent_dispatch_cost_contract_v1.md.
            Stay strictly inside the issue scope and architecture boundaries.
            Minimize token/context use: search first, read only relevant files/ranges, avoid broad history and repository dumps.
            Do not reopen settled design decisions. Stop once acceptance criteria are satisfied.
            This runner has no implicit access to devlap, gurkdb, Odroid, local DB/data, or runtime services.
            Do not deploy, mutate runtime/DB state, call private broker APIs, or enable live trading.
            Keep the change small and reviewable. Open a pull request against main. Do not merge it.
          claude_args: |
            --model haiku
            --max-turns 10
            --disallowedTools WebSearch

  sonnet-low:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '[agent:sonnet-low]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Sonnet low effort
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          prompt: |
            HOST: GitHub-hosted ubuntu-latest
            MODEL: sonnet
            EFFORT: low
            ROLE: implementer
            THREAD: CLEAR
            DEPLOYMENT PERMISSION: not granted
            RUNTIME MUTATION PERMISSION: not granted
            DB WRITE PERMISSION: not granted
            BROKER / PRIVATE API PERMISSION: not granted

            Implement GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Trigger instructions:
            ${{ github.event.comment.body }}

            First read AGENTS.md, CLAUDE.md, and docs/ops/agent_dispatch_cost_contract_v1.md.
            Stay strictly inside the issue scope and architecture boundaries.
            Minimize token/context use: search first, read only relevant files/ranges, avoid broad history and repository dumps.
            Do not reopen settled design decisions. Use focused validation only.
            This runner has no implicit access to devlap, gurkdb, Odroid, local DB/data, or runtime services.
            Do not deploy, mutate runtime/DB state, call private broker APIs, or enable live trading.
            Keep the change small and reviewable. Open a pull request against main. Do not merge it.
          claude_args: |
            --model sonnet
            --effort low
            --max-turns 16
            --allowedTools "Bash(python *),Bash(python3 *),Bash(pytest *),Bash(git diff *),Bash(git status *)"
            --disallowedTools WebSearch

  sonnet-medium:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '[agent:sonnet-medium]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Sonnet medium effort
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: main
          prompt: |
            HOST: GitHub-hosted ubuntu-latest
            MODEL: sonnet
            EFFORT: medium
            ROLE: implementer
            THREAD: CLEAR
            DEPLOYMENT PERMISSION: not granted
            RUNTIME MUTATION PERMISSION: not granted
            DB WRITE PERMISSION: not granted
            BROKER / PRIVATE API PERMISSION: not granted

            Implement GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Trigger instructions:
            ${{ github.event.comment.body }}

            First read AGENTS.md, CLAUDE.md, and docs/ops/agent_dispatch_cost_contract_v1.md.
            Stay strictly inside the issue scope and architecture boundaries.
            Use medium effort only to resolve uncertainty necessary for the issue; do not broaden scope.
            Minimize token/context use: search first, read only relevant files/ranges, avoid broad history and repository dumps.
            Use focused validation proportional to the change. Stop once acceptance evidence is sufficient.
            This runner has no implicit access to devlap, gurkdb, Odroid, local DB/data, or runtime services.
            Do not deploy, mutate runtime/DB state, call private broker APIs, or enable live trading.
            Open a pull request against main. Do not merge it.
          claude_args: |
            --model sonnet
            --effort medium
            --max-turns 24
            --allowedTools "Bash(python *),Bash(python3 *),Bash(pytest *),Bash(git diff *),Bash(git status *)"
            --disallowedTools WebSearch
