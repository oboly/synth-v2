services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: synth
      MARIADB_USER: synth
      MARIADB_PASSWORD: synthpw
      MARIADB_ROOT_PASSWORD: rootpw
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    image: python:3.11-slim
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
    environment:
      TZ: UTC
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: synth
      DB_USER: synth
      DB_PASS: synthpw
    command: ["bash", "-lc", "python -V && sleep infinity"]

volumes:
  mariadb_data: