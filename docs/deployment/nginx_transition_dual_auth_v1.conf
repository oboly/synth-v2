# nginx_transition_dual_auth_v1.conf
# ======================================================================
# Transitional nginx config: Basic Auth + application session authorization.
#
# Activation sequence:
#   1. Apply migration 20260607_profile_session_authorization_v1.sql
#   2. Restart synth-website-registration service
#   3. Replace current nginx config with this file
#   4. nginx -t && nginx -s reload
#   5. Run acceptance tests (see profile_session_authorization_v1.md)
#   6. Only after acceptance tests pass: switch to nginx_auth_request_template_v1.conf
#      and remove the auth_basic blocks.
#
# Security properties of this transitional state:
#   - All /synth/* routes require HTTP Basic Auth (unchanged from current production).
#   - /synth/web-auth/* proxied to auth service (registration, login, logout, etc.).
#   - /synth/accounts/<profile>/* additionally requires application session/profile auth.
#   - Possessing only Basic Auth credentials does NOT grant account-page access.
#   - Application login is only reachable after Basic Auth — no unauthenticated registration.
#
# Rate limiting:
#   The auth service reads X-Real-IP for rate limiting. nginx sets this to $remote_addr
#   (the actual client IP as seen by nginx) and the service ignores X-Forwarded-For.
#
# Usage:
#   Copy this file into place on the nginx host.
#   Replace <YOUR_DOMAIN> with the actual hostname.
#   Replace <HTPASSWD_PATH> with the .htpasswd file path.
# ======================================================================

server {
    listen 443 ssl;
    server_name <YOUR_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/html;

    # ----------------------------------------------------------------
    # Basic Auth — applies to all /synth/* routes globally.
    # This remains active throughout the transition period.
    # ----------------------------------------------------------------
    auth_basic           "SYNTH";
    auth_basic_user_file <HTPASSWD_PATH>;

    # ----------------------------------------------------------------
    # Web-auth service: registration, login, logout, healthz.
    # Basic Auth must be satisfied first (from global block above),
    # then the request reaches the auth service.
    # ----------------------------------------------------------------
    location /synth/web-auth/ {
        location = /synth/web-auth/check-access {
            deny all;
        }

        proxy_pass         http://127.0.0.1:8786;
        proxy_set_header   Host              $host;
        # X-Real-IP from $remote_addr — rate limiting uses this, not X-Forwarded-For.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ----------------------------------------------------------------
    # Internal auth-check subrequest.
    # ----------------------------------------------------------------
    location @synth_check_access {
        internal;
        proxy_pass             http://127.0.0.1:8786/synth/web-auth/check-access;
        proxy_pass_request_body off;
        proxy_set_header       Content-Length            "";
        proxy_set_header       Host                      $host;
        proxy_set_header       Cookie                    $http_cookie;
        proxy_set_header       X-Real-IP                 $remote_addr;
        proxy_set_header       X-Forwarded-For           $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto         $scheme;
        proxy_set_header       X-Synth-Requested-Profile $synth_profile_slug;
    }

    location @synth_login_required {
        return 302 /synth/login.html?reason=unauthorized;
    }

    location @synth_forbidden {
        return 302 /synth/login.html?reason=forbidden;
    }

    location @synth_session_expired {
        return 302 /synth/login.html?reason=session_expired;
    }

    # ----------------------------------------------------------------
    # Public static routes (Basic Auth still required in transition).
    # ----------------------------------------------------------------
    location = /synth/ {
        try_files $uri $uri/index.html =404;
    }

    location = /synth/about.html      { try_files $uri =404; }
    location = /synth/register.html   { try_files $uri =404; }
    location = /synth/login.html      { try_files $uri =404; }
    location = /synth/verify-result.html { try_files $uri =404; }
    location /synth/assets/           { try_files $uri =404; }

    # ----------------------------------------------------------------
    # Protected: onboarding page — any valid application session.
    # ----------------------------------------------------------------
    location = /synth/onboarding.html {
        set $synth_profile_slug "";
        auth_request @synth_check_access;
        error_page 401 = @synth_login_required;
        error_page 403 = @synth_forbidden;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # Protected: account pages — session owner must match profile slug.
    # Profile slug extracted from URI by nginx (not from client header).
    # ----------------------------------------------------------------
    location ~ ^/synth/accounts/([a-z0-9][a-z0-9_-]{0,62})(/.*)? {
        set $synth_profile_slug $1;

        auth_request @synth_check_access;
        error_page 401 = @synth_login_required;
        error_page 403 = @synth_forbidden;

        if ($request_uri ~ "\.\./") {
            return 400;
        }

        try_files $uri $uri/index.html =404;
    }

    location = /synth/web-auth/check-access {
        deny all;
    }
}

server {
    listen 80;
    server_name <YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}
