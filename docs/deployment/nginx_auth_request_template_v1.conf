# nginx_auth_request_template_v1.conf
# ======================================================================
# Canonical nginx template for SYNTH profile-scoped session authorization.
#
# This template targets the FUTURE cutover state.
# Basic Auth is NOT removed in this task and remains active in production
# until application authentication has passed all acceptance tests.
#
# Authorization flow:
#   browser request
#   → nginx matches route
#   → auth_request to /synth/web-auth/check-access (internal)
#   → check-access validates session cookie + profile ownership
#   → 2xx: nginx serves static file
#   → 401: nginx redirects to /synth/login.html?reason=unauthorized
#   → 403: nginx redirects to /synth/login.html?reason=forbidden
#
# Profile slug extraction:
#   nginx extracts the profile code from the matched URI via a regex
#   capture group and sets X-Synth-Requested-Profile from that capture.
#   The client cannot spoof this header; nginx overwrites it from the URI.
#
# Usage:
#   Copy the relevant server { } block into your nginx site configuration.
#   Replace <YOUR_DOMAIN> with the actual hostname.
#   Do not edit /etc/nginx directly in development tasks.
# ======================================================================

server {
    listen 443 ssl;
    server_name <YOUR_DOMAIN>;

    # TLS — managed externally (e.g., certbot / Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Correct forwarding of scheme, host, and client IP to the auth service.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ----------------------------------------------------------------
    # Preserve existing Basic Auth (NOT removed until cutover acceptance
    # tests pass). Remove this block only after sign-off.
    # ----------------------------------------------------------------
    # auth_basic           "SYNTH";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    # (Commented out here to show target state; keep active in current prod)

    # ----------------------------------------------------------------
    # Static file root (Hugo-generated public dashboard).
    # ----------------------------------------------------------------
    root /var/www/html;

    # ----------------------------------------------------------------
    # Public routes — no auth required.
    # ----------------------------------------------------------------

    location = /synth/ {
        try_files $uri $uri/index.html =404;
    }

    location = /synth/about.html {
        try_files $uri =404;
    }

    location = /synth/register.html {
        try_files $uri =404;
    }

    location = /synth/login.html {
        try_files $uri =404;
    }

    location = /synth/verify-result.html {
        try_files $uri =404;
    }

    location /synth/assets/ {
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # Web-auth service (registration, verification, login, logout,
    # auth-check). Reverse proxy to the isolated Python service.
    # ----------------------------------------------------------------
    location /synth/web-auth/ {
        # Block direct external access to the internal check-access endpoint.
        # External clients must go through the auth_request flow only.
        location = /synth/web-auth/check-access {
            deny all;
        }

        proxy_pass         http://127.0.0.1:8786;
        proxy_set_header   Host              $host;
        # X-Real-IP carries the actual client IP as seen by nginx ($remote_addr).
        # The auth service uses X-Real-IP for rate limiting — not X-Forwarded-For,
        # whose leftmost hop is client-controlled and trivially spoofable.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # ----------------------------------------------------------------
    # Internal auth-check subrequest location.
    # Only reachable via auth_request directive, not from the public.
    # nginx sets X-Synth-Requested-Profile from its own regex capture,
    # overwriting any client-supplied value.
    # ----------------------------------------------------------------
    location @synth_check_access {
        internal;
        proxy_pass             http://127.0.0.1:8786/synth/web-auth/check-access;
        proxy_pass_request_body off;
        proxy_set_header       Content-Length          "";
        proxy_set_header       Host                    $host;
        proxy_set_header       Cookie                  $http_cookie;
        proxy_set_header       X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto       $scheme;
        # Profile slug injected by nginx from URI capture — not from client.
        proxy_set_header       X-Synth-Requested-Profile $synth_profile_slug;
    }

    # ----------------------------------------------------------------
    # Error page handlers for auth failures.
    # These redirect to the login page with a reason code.
    # ----------------------------------------------------------------
    location @synth_login_required {
        return 302 /synth/login.html?reason=unauthorized;
    }

    location @synth_forbidden {
        return 302 /synth/login.html?reason=forbidden;
    }

    location @synth_session_expired {
        return 302 /synth/login.html?reason=session_expired;
    }

    # ----------------------------------------------------------------
    # Protected: /synth/onboarding.html
    # Requires a valid session. No profile slug check (any valid session).
    # ----------------------------------------------------------------
    location = /synth/onboarding.html {
        set $synth_profile_slug "";
        auth_request @synth_check_access;
        error_page 401 = @synth_login_required;
        error_page 403 = @synth_forbidden;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # Protected: /synth/api-account-connect.html
    # Future milestone — disabled credential collection page.
    # Requires a valid session.
    # ----------------------------------------------------------------
    location = /synth/api-account-connect.html {
        set $synth_profile_slug "";
        auth_request @synth_check_access;
        error_page 401 = @synth_login_required;
        error_page 403 = @synth_forbidden;
        try_files $uri =404;
    }

    # ----------------------------------------------------------------
    # Protected: /synth/accounts/<profile>/...
    # Profile slug is extracted from the URI by nginx (not from client).
    # The auth_request endpoint validates that the session owner matches
    # the extracted profile slug.
    #
    # Pattern: profile_code = [a-z0-9][a-z0-9_-]{0,62}
    # ----------------------------------------------------------------
    location ~ "^/synth/accounts/([a-z0-9][a-z0-9_-]{0,62})(/.*)?" {
        # Extract profile slug from URI (nginx regex capture — client cannot spoof).
        set $synth_profile_slug $1;

        auth_request @synth_check_access;
        error_page 401 = @synth_login_required;
        error_page 403 = @synth_forbidden;

        # Prevent profile path traversal: disallow ../ sequences in URI.
        if ($request_uri ~ "\.\./") {
            return 400;
        }

        try_files $uri $uri/index.html =404;
    }

    # Block any direct access to the auth service check-access path
    # that somehow bypasses the location rules above (defense in depth).
    location = /synth/web-auth/check-access {
        deny all;
    }
}

# ----------------------------------------------------------------
# HTTP → HTTPS redirect.
# ----------------------------------------------------------------
server {
    listen 80;
    server_name <YOUR_DOMAIN>;
    return 301 https://$host$request_uri;
}
