protocol_name: cq_v1_holdout_comparison_v1
protocol_version: 1.0.0
parent_issue: 568
phase_issue: 620

holdout:
  design: frozen_single_cross_section
  reason: >-
    The frozen Phase 2C population is one 2026-08-26T20:15:47Z cross-section,
    so chronological train/validation/holdout splitting is not identifiable.
    The entire frozen cross-section is therefore treated as the first untouched
    cross-sectional holdout because CQ v1 transforms and weights were frozen
    before forward outcomes were inspected.
  observation_asof_ts_utc: '2026-08-26T20:15:47Z'
  required_horizons: [1h, 4h, 24h]
  frozen_population:
    score_row_count: 419
    last_shadow_id: 619
    outcome_row_count: 1257
    outcome_rows_per_horizon: 419

inputs:
  frozen_manifest_name: cq_v1_holdout_input_manifest_v1
  frozen_manifest_version: 1.0.0
  forward_outcome_runner: entry_quality_forward_validation_v1
  score_runner: cq_v1_score_materialization_v1
  required_identity_fields:
    - shadow_id
    - asset_id
    - venue
    - evidence_key
    - cq_model_version
  required_score_candidates:
    - cq_v1_mrp_balanced_v1
    - cq_v1_mrp_anchor_v1

metrics:
  score_families:
    - ppp_pct
    - trade_quality_score
    - selection_score
    - cq_v0
    - entry_strength_v0
    - cq_v1_mrp_balanced_v1
    - cq_v1_mrp_anchor_v1
    - entry_strength_cq_v1_mrp_balanced_v1
    - entry_strength_cq_v1_mrp_anchor_v1
  outcome_fields:
    - forward_return_pct
    - mfe_pct
    - mae_pct
  correlation:
    - pearson
    - spearman
  buckets: 5

eligibility:
  candidate_state_required: AVAILABLE
  outcome_status_required: COMPLETE
  identical_sample_comparison: true
  ppp_kind_cohorts_separate: true
  non_finite: reject
  duplicate_identity: reject
  target_outcomes: unavailable_no_canonical_target_price

promotion_rule:
  minimum_candidate_sample: 100
  material_spearman_delta: 0.02

safety:
  research_only: 1
  market_only: 1
  db_writes: 0
  production_ranking_changes: 0
  decision_gate_changes: 0
  execution_planner_changes: 0
  executor_changes: 0
  broker_private_calls: 0
  broker_writes: 0
  order_submission: 0
  live_orders: 0
